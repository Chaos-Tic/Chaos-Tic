<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Lorenz: file conversion at your cursor">
<style>.in{animation:in .9s cubic-bezier(.2,.8,.3,1) .2s both}@keyframes in{from{transform:translateY(8px)}to{transform:none}}@media (prefers-reduced-motion:reduce){.in{animation:none}}</style>
<defs><clipPath id="c"><rect width="600" height="250" rx="22"/></clipPath><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="45"/></filter>
<linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40baf0"/><stop offset=".35" stop-color="#8f7bff"/><stop offset=".65" stop-color="#ff7fc8"/><stop offset="1" stop-color="#ffb35c"/></linearGradient></defs>
<g clip-path="url(#c)"><rect width="600" height="250" fill="#11131f"/><g filter="url(#s)"><circle cx="520" cy="40" r="120" fill="#0e6c96"/><circle cx="380" cy="260" r="110" fill="#8a2f6e"/><circle cx="600" cy="230" r="90" fill="#4a2fa0"/></g><rect width="600" height="250" fill="#1a1c30" fill-opacity=".55"/></g>
<rect x=".5" y=".5" width="599" height="249" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
<rect x="1" y="1" width="598" height="248" rx="21" fill="none" stroke="url(#film)" stroke-opacity=".55"/>
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
<text x="32" y="44" fill="#bcc2d0" font-size="11" font-weight="600" letter-spacing="2.5">FEATURED · WINDOWS &amp; LINUX</text>
<text x="30" y="88" fill="#f3f4f8" font-size="34" font-weight="600" letter-spacing="-1">Lorenz</text>
<text x="32" y="122" fill="#bcc2d0" font-size="14">File conversion at your cursor. Drag a file,</text>
<text x="32" y="142" fill="#bcc2d0" font-size="14">tap Shift, Ctrl or Alt, release on a choice.</text>
<text x="32" y="162" fill="#bcc2d0" font-size="14">Everything stays on your computer.</text>
<rect x="32" y="196" width="50" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="57" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">Rust</text>
<rect x="90" y="196" width="50" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="115" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">Qt 6</text>
<rect x="148" y="196" width="64" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="180" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">FFmpeg</text>
<rect x="220" y="196" width="71" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="255" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">EN / FR</text>
<g class="in"><circle cx="478" cy="125" r="88" fill="#ffffff" fill-opacity=".08"/><circle cx="478" cy="125" r="88" fill="none" stroke="url(#film)" stroke-width="1.4"/>
<g fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".22" stroke-width=".8"><rect x="462" y="44" width="32" height="27" rx="8"/><rect x="514" y="72" width="32" height="27" rx="8"/><rect x="514" y="152" width="32" height="27" rx="8"/><rect x="462" y="180" width="32" height="27" rx="8"/><rect x="410" y="152" width="32" height="27" rx="8"/></g>
<g fill="#f3f4f8" font-size="8.5" font-weight="600" text-anchor="middle"><text x="478" y="61">AVIF</text><text x="530" y="89">BMP</text><text x="530" y="169">JPG</text><text x="478" y="197">PDF</text><text x="426" y="169">TIFF</text></g>
<rect x="398" y="62" width="48" height="42" rx="12" fill="#ffffff" fill-opacity=".85" stroke="#40baf0" stroke-opacity=".8"/><text x="422" y="88" text-anchor="middle" fill="#9fdcf8" font-size="13" font-weight="700">WEBP</text>
<circle cx="478" cy="125" r="34" fill="#ffffff" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".22"/><text x="478" y="128" text-anchor="middle" fill="#9fdcf8" font-size="15" font-weight="700">WEBP</text><text x="478" y="140" text-anchor="middle" fill="#f3f4f8" font-size="6.5" font-weight="600">Release to convert</text></g>
</g></svg>
