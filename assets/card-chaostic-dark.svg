<rect x=".5" y=".5" width="599" height="249" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
<rect x="1" y="1" width="598" height="248" rx="21" fill="none" stroke="url(#film)" stroke-opacity=".55"/>
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
<text x="32" y="44" fill="#bcc2d0" font-size="11" font-weight="600" letter-spacing="2.5">FEATURED · LINUX</text>
<text x="30" y="88" fill="#f3f4f8" font-size="34" font-weight="600" letter-spacing="-1">ChaosticTool</text>
<text x="32" y="122" fill="#bcc2d0" font-size="14">A control surface for authorized engagements:</text>
