<rect x="104" y="196" width="78" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="143" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">Rich TUI</text>
<rect x="190" y="196" width="57" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="218" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">Linux</text>
<rect x="255" y="196" width="78" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="294" y="212" text-anchor="middle" fill="#bcc2d0" font-size="11.5" font-weight="500">Red team</text>
<g class="in"><rect x="372" y="48" width="200" height="154" rx="12" fill="#0a0c16" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".25"/>
<circle cx="388" cy="62" r="3.5" fill="#ff5f57"/><circle cx="400" cy="62" r="3.5" fill="#febc2e"/><circle cx="412" cy="62" r="3.5" fill="#28c840"/>
<g font-family="'Geist Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="9.5"><text x="384" y="90" fill="#9aa4b8">$ <tspan fill="#e8ecf4">chaostic recon lab.local</tspan></text>
<text x="384" y="108" fill="#40baf0">› ports      <tspan fill="#e8ecf4">22 80 443</tspan></text><text x="384" y="124" fill="#8f7bff">› services   <tspan fill="#e8ecf4">ssh http https</tspan></text>
<text x="384" y="140" fill="#ff7fc8">› web        <tspan fill="#e8ecf4">3 findings</tspan></text><text x="384" y="156" fill="#ffb35c">› evidence   <tspan fill="#e8ecf4">saved</tspan></text>
<text x="384" y="180" fill="#9aa4b8">$ <tspan fill="#e8ecf4">▍</tspan></text></g></g>
</g></svg>
