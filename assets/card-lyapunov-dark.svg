<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Lyapunov: save an activity as a card and resume it later">
<defs>
  <clipPath id="clip"><rect width="600" height="250" rx="22"/></clipPath>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="45"/></filter>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40baf0"/><stop offset=".35" stop-color="#8f7bff"/><stop offset=".65" stop-color="#ff7fc8"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fdcf8"/><stop offset=".55" stop-color="#c5b1f7"/><stop offset="1" stop-color="#ffc39a"/></linearGradient>
</defs>
<g clip-path="url(#clip)"><rect width="600" height="250" fill="#151726"/><g filter="url(#blur)"><circle cx="520" cy="40" r="120" fill="#0e6c96"/><circle cx="380" cy="260" r="110" fill="#8a2f6e"/><circle cx="600" cy="230" r="90" fill="#4a2fa0"/></g><rect width="600" height="250" fill="#1b1d31" fill-opacity=".55"/></g>
<rect x=".5" y=".5" width="599" height="249" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".24"/>
<rect x="1" y="1" width="598" height="248" rx="21" fill="none" stroke="url(#film)" stroke-opacity=".55"/>
<g font-family="Geist, 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
  <text x="32" y="44" fill="#bfc5d3" font-size="11" font-weight="600" letter-spacing="2.5">NEW · LINUX &amp; WINDOWS</text>
  <text x="30" y="88" fill="#f3f4f8" font-size="34" font-weight="600" letter-spacing="-1">Lyapunov</text>
  <text x="32" y="122" fill="#bfc5d3" font-size="14">Save an activity as a card. Return to its apps</text>
  <text x="32" y="142" fill="#bfc5d3" font-size="14">and places in one gesture, with a clear preview.</text>
  <text x="32" y="162" fill="#bfc5d3" font-size="14">Everything stays on your computer.</text>
  <rect x="32" y="196" width="50" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="57" y="212" text-anchor="middle" fill="#bfc5d3" font-size="11.5" font-weight="500">Rust</text>
  <rect x="90" y="196" width="50" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="115" y="212" text-anchor="middle" fill="#bfc5d3" font-size="11.5" font-weight="500">Qt 6</text>
  <rect x="148" y="196" width="71" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="183" y="212" text-anchor="middle" fill="#bfc5d3" font-size="11.5" font-weight="500">EN / FR</text>
  <rect x="227" y="196" width="55" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/><text x="254" y="212" text-anchor="middle" fill="#bfc5d3" font-size="11.5" font-weight="500">0.2.0</text>
  <g transform="rotate(-8 480 123)">
    <rect x="399" y="28" width="152" height="108" rx="20" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".24"/>
    <text x="419" y="55" fill="#f3f4f8" font-size="12" font-weight="600">Photos</text>
  </g>
  <g transform="rotate(5 480 132)">
    <rect x="388" y="60" width="164" height="112" rx="20" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".24"/>
    <text x="408" y="88" fill="#f3f4f8" font-size="12" font-weight="600">Reading list</text>
  </g>
  <rect x="375" y="96" width="182" height="123" rx="22" fill="url(#card)" fill-opacity=".24" stroke="#ffffff" stroke-opacity=".24"/>
  <rect x="377" y="98" width="178" height="119" rx="20" fill="#ffffff" fill-opacity=".09"/>
  <text x="395" y="130" fill="#f3f4f8" font-size="15" font-weight="600">Personal website</text>
  <text x="395" y="153" fill="#bfc5d3" font-size="10.5">VS Code · files · browser</text>
  <rect x="395" y="173" width="142" height="30" rx="15" fill="#f3f4f8" fill-opacity=".88"/>
  <text x="466" y="193" text-anchor="middle" fill="#151726" font-size="11" font-weight="600">Resume this space</text>
</g></svg>
